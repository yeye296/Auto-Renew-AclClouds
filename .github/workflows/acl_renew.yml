name: ACLClouds Auto Renew

on:
  workflow_dispatch:
  schedule:
    - cron: '50 0 * * *' # 每天 UTC 1：00 触发（北京时间 9：00），由脚本判断是否执行，四天一续

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📅 日期检查
        id: check
        run: |
          START="2026-09-29"
          TODAY=$(date -u +%F)
          start_sec=$(date -d "$START" +%s)
          today_sec=$(date -d "$TODAY" +%s)
          days=$(( (today_sec - start_sec) / 86400 ))
          echo "Days since $START: $days"
          if (( days % 4 == 0 )); then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出仓库代码
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install System Dependencies
        if: steps.check.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Dependencies
        if: steps.check.outputs.should_run == 'true'
        run: |
          pip install --upgrade pip
          pip install seleniumbase requests ddddocr
          sbase install chromedriver

      # - name: Install gost (Proxy)
      #   if: steps.check.outputs.should_run == 'true'
      #   run: |
      #     wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
      #     gzip -d gost-linux-amd64-2.11.5.gz
      #     sudo mv gost-linux-amd64-2.11.5 /usr/local/bin/gost
      #     chmod +x /usr/local/bin/gost

      - name: Run Renew Script
        if: steps.check.outputs.should_run == 'true'
        env:
          ACL_USERNAME: ${{ secrets.EMAIL }}
          ACL_PASSWORD: ${{ secrets.PASSWORD }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python -u renew.py

      # --- 新增的防暂停代码开始 ---
      - name: Commit time.txt to repo
        # if: success()
        if: steps.check.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 如果 time.txt 不存在，说明是第一次运行
          if [ ! -f time.txt ]; then
            echo "首次生成时间：$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          else
            echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
          fi
          
          git add time.txt
          
          # 如果有更改再提交
          if git diff --cached --quiet; then
            echo "无变化，无需提交"
          else
            git commit -m "⏱️ 更新时间文件: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin HEAD:main
          fi
      # --- 新增的防暂停代码结束 ---

      - name: 上传排查截图
        # if: always()
        if: steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
